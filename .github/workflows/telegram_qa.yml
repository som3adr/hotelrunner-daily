name: Telegram Q&A

on:
  schedule:
    - cron: "2-57/5 0,7-23 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch:

concurrency:
  group: telegram-qa
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest reservation cache
        uses: actions/cache/restore@v4
        with:
          path: |
            reservations_cache.json
            hotelrunner_snapshot.json
            hotelrunner_latest_updates.json
            alert_state.json
            gemini_monitor_state.json
            morning_delivery_state.json
            transfer_state.json
            system_health.json
            telegram_run_log.json
          key: telegram-qa-input-${{ github.run_id }}
          restore-keys: hotelrunner-cache-${{ runner.os }}-

      - name: Restore Telegram Q&A state
        uses: actions/cache/restore@v4
        with:
          path: telegram_bot_state.json
          key: telegram-qa-state-${{ github.run_id }}
          restore-keys: telegram-qa-state-

      - name: Poll Telegram and answer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python telegram_bot.py --poll

      - name: Save Telegram Q&A state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: telegram_bot_state.json
          key: telegram-qa-state-${{ github.run_id }}
