name: HotelRunner Daily Summary

on:
  # Avoid the top of the hour because GitHub may delay or drop busy cron events.
  schedule:
    # Rebuild the operational cache from a broad creation-date window before morning.
    - cron: "37 6 * * *"
      timezone: "Africa/Casablanca"
    - cron: "7 7 * * *"
      timezone: "Africa/Casablanca"
    - cron: "22 7 * * *"
      timezone: "Africa/Casablanca"
    - cron: "37 7 * * *"
      timezone: "Africa/Casablanca"
    - cron: "17 0,8-23 * * *"
      timezone: "Africa/Casablanca"
  # Trigger manually from the GitHub website anytime
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "check"
        type: choice
        options:
          - check
          - full
          - transfers
          - reconcile

concurrency:
  group: hotelrunner-operations
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── Install Python dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Restore the reservation cache (persisted between runs) ────────────────
      - name: Restore reservation cache
        uses: actions/cache@v4
        with:
          path: |
            reservations_cache.json
            hotelrunner_snapshot.json
            hotelrunner_latest_updates.json
            alert_state.json
            operations_monitor_state.json
            morning_delivery_state.json
            transfer_state.json
            system_health.json
            telegram_run_log.json

          key: hotelrunner-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hotelrunner-cache-${{ runner.os }}-

      # ── Fetch latest reservations from HotelRunner & build HTML dashboard ─────
      - name: Fetch reservations
        env:
          HOTELRUNNER_TOKEN: ${{ secrets.HOTELRUNNER_TOKEN }}
          HOTELRUNNER_HR_ID: ${{ secrets.HOTELRUNNER_HR_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ "${{ github.event.schedule }}" = "37 6 * * *" ] || [ "${{ github.event.inputs.mode }}" = "reconcile" ]; then
            python hotelrunner_daily_summary.py --lookback-days 730 --max-pages 100 --page-delay 0.25
          else
            python hotelrunner_daily_summary.py --max-pages 15 --page-delay 1
          fi

      - name: Validate operational output
        run: python operations_qa.py


      # ── Determine which mode to run ───────────────────────────────────────────
      # Use the triggering schedule, not the runner clock, because cron jobs can be delayed.
      - name: Decide mode
        id: mode
        run: |
          HOUR=$(TZ=Africa/Casablanca date +%H)
          MIN=$(TZ=Africa/Casablanca date +%M)
          SCHEDULE="${{ github.event.schedule }}"
          echo "hour=$HOUR" >> $GITHUB_OUTPUT
          echo "min=$MIN" >> $GITHUB_OUTPUT
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ "$INPUT_MODE" = "full" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "scheduled_morning=false" >> $GITHUB_OUTPUT
          elif [ "$INPUT_MODE" = "transfers" ]; then
            echo "mode=transfers" >> $GITHUB_OUTPUT
            echo "scheduled_morning=false" >> $GITHUB_OUTPUT
          elif [ "$INPUT_MODE" = "reconcile" ]; then
            echo "mode=check" >> $GITHUB_OUTPUT
            echo "scheduled_morning=false" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "7 7 * * *" ] || [ "$SCHEDULE" = "22 7 * * *" ] || [ "$SCHEDULE" = "37 7 * * *" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "scheduled_morning=true" >> $GITHUB_OUTPUT
          else
            echo "mode=check" >> $GITHUB_OUTPUT
            echo "scheduled_morning=false" >> $GITHUB_OUTPUT
          fi

      - name: Check morning delivery
        id: morning
        if: steps.mode.outputs.scheduled_morning == 'true'
        run: python morning_delivery.py check >> $GITHUB_OUTPUT

      # ── Send team Telegram messages (existing, unchanged) ─────────────────────
      - name: Send Team Telegram
        if: steps.mode.outputs.mode != 'transfers' && (steps.mode.outputs.scheduled_morning != 'true' || steps.morning.outputs.sent != 'true')
        env:
          HOTELRUNNER_TOKEN: ${{ secrets.HOTELRUNNER_TOKEN }}
          HOTELRUNNER_HR_ID: ${{ secrets.HOTELRUNNER_HR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_send.py --mode ${{ steps.mode.outputs.mode }} --team-only

      # ── Send Manager Report (morning only) ───────────────────────────────────
      - name: Send Manager Report
        if: steps.mode.outputs.mode == 'full' && (steps.mode.outputs.scheduled_morning != 'true' || steps.morning.outputs.sent != 'true')
        env:
          HOTELRUNNER_TOKEN: ${{ secrets.HOTELRUNNER_TOKEN }}
          HOTELRUNNER_HR_ID: ${{ secrets.HOTELRUNNER_HR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python manager_report.py --send

      - name: Mark morning delivery
        if: steps.mode.outputs.scheduled_morning == 'true' && steps.morning.outputs.sent != 'true' && success()
        run: python morning_delivery.py mark

      # ── Send Tomorrow Transfers at 17:xx and 20:xx Morocco time, or manually ──
      - name: Send Tomorrow Transfers
        if: steps.mode.outputs.mode == 'transfers' || steps.mode.outputs.hour == '17' || steps.mode.outputs.hour == '20'
        env:
          HOTELRUNNER_TOKEN: ${{ secrets.HOTELRUNNER_TOKEN }}
          HOTELRUNNER_HR_ID: ${{ secrets.HOTELRUNNER_HR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python tomorrow_transfers.py --send

      # ── Save updated cache and snapshot for next run ──────────────────────────
      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            reservations_cache.json
            hotelrunner_snapshot.json
            hotelrunner_latest_updates.json
            alert_state.json
            operations_monitor_state.json
            morning_delivery_state.json
            transfer_state.json
            system_health.json
            telegram_run_log.json

          key: hotelrunner-cache-${{ runner.os }}-${{ github.run_id }}

      # ── Deploy interactive HTML dashboard to GitHub Pages ─────────────────────
      - name: Setup Pages
        if: steps.mode.outputs.mode != 'transfers'
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        if: steps.mode.outputs.mode != 'transfers'
        run: |
          mkdir -p _site
          cp hotelrunner_dashboard.html _site/index.html
          cp olas-surf-camp.png _site/olas-surf-camp.png

      - name: Upload Pages artifact
        if: steps.mode.outputs.mode != 'transfers'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.mode.outputs.mode != 'transfers'
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional AI analysis runs last, so provider problems cannot delay reports or Pages.
      - name: CodeCraft Operations Monitor
        if: steps.mode.outputs.mode == 'check'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODECRAFT_API_KEY: ${{ secrets.CODECRAFT_API_KEY }}
          CODECRAFT_MODEL: ${{ secrets.CODECRAFT_MODEL }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python operations_monitor.py --send
