<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Olas Operations</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7f5;
      color: #15231f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); }
    img { width: 104px; height: 104px; object-fit: contain; display: block; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: #26705c; font-size: 13px; font-weight: 750; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 9vw, 54px); line-height: 1.02; letter-spacing: 0; }
    p { margin: 18px 0 0; color: #52635e; font-size: 17px; line-height: 1.6; }
    .status { display: flex; align-items: center; gap: 10px; margin-top: 32px; padding-top: 20px; border-top: 1px solid #d6dfdb; color: #314a42; font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #2f9e72; box-shadow: 0 0 0 5px #dff3e9; }
  </style>
</head>
<body>
  <main>
    <img src="/olas-surf-camp.png" alt="Olas Surf Experience">
    <p class="eyebrow">Private operations</p>
    <h1>Olas dashboard is moving.</h1>
    <p>This safe placeholder confirms the new Cloudflare home is ready. Guest operations will appear only after access protection is enabled and verified.</p>
    <div class="status"><span class="dot"></span>Cloudflare Worker ready for access protection</div>
  </main>
</body>
</html>
